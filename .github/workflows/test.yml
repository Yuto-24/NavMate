name: test

on:
  push:
    branches: [main, release/1.x, release/2.x]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-tooling-install:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_static_tooling_install != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Regression fixture: the production app can be older than the tooling.
          ref: a4de2a226dfa205b8be42fb62a710a1b06271ed8
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 64225b82c9b2e978409f0b35490be3c83af3f157
          path: reviewed-schema431
          fetch-depth: 0
          persist-credentials: false
      - name: Install workflow dependencies from the tooling checkout and import the producer
        run: python tooling/tests/integration/check_static_tooling_install.py
      - name: Build credential-free artifact handoff test image
        run: docker build -f tooling/scripts/static_ops/Dockerfile.build --tag autonavlog-static-build tooling
      - name: Verify Docker outputs can be extended by the nonroot runner
        run: python tooling/tests/integration/check_static_artifact_handoff.py

  release-sources:
    runs-on: ubuntu-latest
    outputs:
      run_release_build: ${{ steps.changes.outputs.run_release_build }}
      run_pytest: ${{ steps.changes.outputs.run_pytest }}
      run_runtime: ${{ steps.changes.outputs.run_runtime }}
      run_web: ${{ steps.changes.outputs.run_web }}
      run_taf_proxy: ${{ steps.changes.outputs.run_taf_proxy }}
      run_local_browser: ${{ steps.changes.outputs.run_local_browser }}
      run_account_sync: ${{ steps.changes.outputs.run_account_sync }}
      run_static_tooling_install: ${{ steps.changes.outputs.run_static_tooling_install }}
      run_msm_trigger: ${{ steps.changes.outputs.run_msm_trigger }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8.3,<9"
      - name: Check retained UI copy review evidence and source context
        run: python scripts/ui_copy_review.py check
      - name: Check CI classification and source contracts without application dependencies
        run: >-
          python -m pytest --noconftest
          tests/integration/check_ci_changes.py
          tests/integration/check_ci_gate.py
          tests/unit/test_account_sync_ci.py
          tests/integration/check_release_merge.py
          tests/unit/test_release_ci.py
          tests/unit/test_ui_copy_review.py
          tests/unit/test_publish_github_release.py
          tests/integration/check_publish_github_release.py
          tests/unit/test_supported_runtime_contract.py
          tests/unit/test_version.py::test_version_is_the_only_release_version_source
      - name: Determine CI scope
        id: changes
        run: python scripts/ci_changes.py
      - name: Validate release sources and PR contract
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BASE" ] || [ -n "$PR_HEAD" ]; then
            printf "%s" "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            python scripts/validate_release.py --base "$PR_BASE" --pr-head "$PR_HEAD" --pr-body-file "$RUNNER_TEMP/pr-body.md"
          else
            python scripts/validate_release.py
          fi

  release-build:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_release_build != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install "build>=1.2,<2"
      - run: npm --prefix web ci
      - run: npm --prefix web run test:release-notes
      # The existing build generates release notes and runs tsc before Vite.
      - run: npm --prefix web run build
      - name: Build and verify the release package
        run: |
          mkdir -p src/autonavlog/web/static
          cp -R web/dist/. src/autonavlog/web/static/
          python -m build
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path

          package = distribution("autonavlog")
          assert package.version == Path("VERSION").read_text(encoding="utf-8").strip()
          assert package.locate_file("autonavlog/web/static/index.html").is_file()
          PY

  pytest-tests:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_pytest != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        include:
          - {shard: 1, checks: all}
          - {shard: 2, checks: pytest}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --target test --tag autonavlog:test .
      - name: Run tests with the capability workflow contract
        run: >-
          docker run --rm
          --env CI_PYTEST_SHARD=${{ matrix.shard }}/2
          --env COVERAGE_FILE=/ci-results/.coverage
          --env CI_PYTEST_MANIFEST=/ci-results/collection.json
          --mount type=bind,source=${{ runner.temp }},target=/ci-results
          --mount type=bind,source="$PWD/.github/workflows/static-provider-probe.yml",target=/opt/autonavlog/.github/workflows/static-provider-probe.yml,readonly
          --mount type=bind,source="$PWD/.github/workflows/static-monitor.yml",target=/opt/autonavlog/.github/workflows/static-monitor.yml,readonly
          --mount type=bind,source="$PWD/.github/workflows/static-app-release.yml",target=/opt/autonavlog/.github/workflows/static-app-release.yml,readonly
          autonavlog:test sh scripts/run_ci_checks.sh ${{ matrix.checks }}

      - uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/.coverage
            ${{ runner.temp }}/collection.json
          include-hidden-files: true
          if-no-files-found: error

  pytest:
    needs: [release-sources, pytest-tests]
    if: ${{ always() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_pytest != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python shard
        env:
          RESULT: ${{ needs.pytest-tests.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'coverage>=7.5,<8'
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-coverage-*
          path: coverage-shards
      - name: Verify complete collection and combine coverage
        run: |
          python scripts/check_pytest_shards.py coverage-shards 2
          python -m coverage combine coverage-shards/*/.coverage
          python -m coverage report --rcfile=pyproject.toml

  runtime:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_runtime != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --target runtime --tag autonavlog:runtime .
      - name: Read expected version from the production image source
        run: |
          expected_version="$(docker run --rm --entrypoint python autonavlog:runtime -c 'from pathlib import Path; print(Path("VERSION").read_text(encoding="utf-8").strip())')"
          test -n "$expected_version"
          echo "EXPECTED_VERSION=$expected_version" >> "$GITHUB_ENV"
      - name: Verify production image purity
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' autonavlog:runtime)" = "autonavlog"
          docker run --rm --entrypoint sh autonavlog:runtime -c '
            set -eu
            test "$(id -u)" = "10001"
            test ! -d /opt/autonavlog/tests
            test ! -d /opt/autonavlog/scripts
            test ! -d /opt/autonavlog/.github
            test ! -d /opt/autonavlog/web
            test ! -d /opt/autonavlog/build
            test ! -d /opt/autonavlog/dist
            test ! -d /opt/autonavlog/.pytest_cache
            test ! -d /opt/autonavlog/.mypy_cache
            test ! -d /opt/autonavlog/.ruff_cache
            test ! -d /opt/autonavlog/src/autonavlog.egg-info
            python -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python -c "import importlib.util; assert all(importlib.util.find_spec(module) is None for module in (\"pytest\", \"ruff\", \"mypy\", \"build\"))"
            expected_version="$(python -c '\''from pathlib import Path; print(Path("VERSION").read_text(encoding="utf-8").strip())'\'')"
            installed_version="$(python -c '\''from importlib.metadata import version; print(version("autonavlog"))'\'')"
            test "$installed_version" = "$expected_version"
          '
      - name: Start production image with its default command
        run: docker run --detach --name autonavlog-runtime-smoke --publish 127.0.0.1::8000 autonavlog:runtime
      - name: Check production health within two minutes
        run: |
          port="$(docker port autonavlog-runtime-smoke 8000/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$port"
          response="$(timeout 120s sh -c '
            set -eu
            until response="$(curl --fail --silent --show-error "$1" 2>/dev/null)"; do sleep 2; done
            printf "%s" "$response"
          ' sh "http://127.0.0.1:$port/healthz")"
          docker exec --env HEALTH_RESPONSE="$response" --env EXPECTED_VERSION="$EXPECTED_VERSION" autonavlog-runtime-smoke python -c 'import json, os; health = json.loads(os.environ["HEALTH_RESPONSE"]); assert health == {"status": "ok", "version": os.environ["EXPECTED_VERSION"]}'
      - name: Show runtime logs after failure
        if: failure()
        run: docker logs autonavlog-runtime-smoke
      - name: Remove runtime smoke container and its anonymous volume
        if: always()
        run: docker rm --force --volumes autonavlog-runtime-smoke || true

  web:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_web != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Verify complete browser shard selection
        run: |
          node --test web/scripts/check-account-sync-partition.test.mjs
          node web/scripts/check-account-sync-partition.mjs
      - run: npm --prefix web run test:application
      - run: npm --prefix web run test:static-artifact
      - run: npm --prefix web run test:release-notes
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - name: Record successful Web source checks
        # Keep the evidence reader/writer regression with its Node toolchain.
        run: |
          node --test web/scripts/source-ci-inventory.test.mjs
          node --test scripts/static_ops/check_migration_browser.test.mjs
          node web/scripts/source-ci-inventory.mjs write "$RUNNER_TEMP/source-ci-web.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-ci-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-ci-web.json
          if-no-files-found: error

  taf-proxy:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_taf_proxy != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/taf-proxy/package-lock.json
      - run: npm --prefix services/taf-proxy ci
      - run: npm --prefix services/taf-proxy test
        env:
          MINIFLARE_ASSERT_BODIES_CONSUMED: "true"
      - run: npm --prefix services/taf-proxy run check

  local-browser-tests:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_local_browser != 'false') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PIP_CACHE_DIR: /tmp/navmate-pip-cache
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [local, acceptance, focused-ux, clipboard, auth]
        shard: [1]
        include:
          - {suite: local, shard: 2}
          - {suite: local, shard: 3}
          - {suite: local, shard: 4}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      # setup-python's Linux pip cache requires lsb_release, absent from the browser image.
      - uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'vendor/*.whl', '.github/workflows/test.yml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install "setuptools>=69" wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl ".[test]"
      - run: npm --prefix web ci
      - run: npm --prefix web run test:terrain
        if: matrix.suite == 'local' && matrix.shard == 1
      - run: npm --prefix web run build:local
        env:
          AUTONAVLOG_TEST_FIXTURES: "1"
          VITE_FORECAST_BACKUP_URL: ""
      - name: Verify auth, browser components and notification recovery
        if: matrix.suite == 'auth'
        run: |
          npm --prefix web run test:auth
          npm --prefix web run test:sync-component
          npm --prefix web run test:notification
          npm --prefix web run test:unreleased
      - name: Verify Local persistence and session/calculation regression without FastAPI
        if: matrix.suite != 'auth'
        env:
          AUTONAVLOG_REFERENCE_PYTHON: python3
        run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory web/dist-local > /tmp/local-server.log 2>&1 &
          local_server_pid=$!
          trap 'kill "$local_server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/ > /dev/null
          # Files stay ordered within each Local shard; all existing tests remain selected.
          if [ "${{ matrix.suite }}" = local ]; then
            npm --prefix web run test:local -- --workers=2 --shard=${{ matrix.shard }}/4
            if [ '${{ matrix.shard }}' = 1 ]; then
              AUTONAVLOG_LOCAL_URL=http://127.0.0.1:4174 npm --prefix web run test:static -- --grep 'production artifact shows storage limits and uses no Service Worker|production artifact rejects a different build manifest and recovers on reload'
            fi
            exit 0
          fi
          if [ "${{ matrix.suite }}" = focused-ux ] || [ "${{ matrix.suite }}" = clipboard ]; then
            npm --prefix web exec -- playwright test --config "web/playwright.${{ matrix.suite }}.config.ts" --workers=2
            exit 0
          fi
          npm --prefix web exec -- playwright test --config web/playwright.navlog-scroll.config.ts --workers=2
          npm --prefix web exec -- playwright test --config web/playwright.browser-acceptance.config.ts --workers=2
          AUTONAVLOG_TEST_FIXTURES=1 VITE_TAF_PROXY_URL=https://taf.example/taf npm --prefix web run build:local
          npm --prefix web run test:taf
      - name: Verify guest forecast backup with the matching isolated calculator
        if: matrix.suite == 'local' && matrix.shard == 1
        run: |
          (cd web && VITE_CALCULATION_MODE=local VITE_FORECAST_BACKUP_URL=http://localhost:4203/api/forecast-backup/jobs/ npm exec -- vite build --outDir dist-backup)
          PYTHONPATH="$PWD/src:$PWD" python tests/integration/serve_forecast_backup_fixture.py --port 4203 --origin http://localhost:4202 --storage "$RUNNER_TEMP/forecast-backup" > /tmp/backup-server.log 2>&1 &
          backup_pid=$!
          python -m http.server 4202 --bind 127.0.0.1 --directory web/dist-backup > /tmp/backup-browser-server.log 2>&1 &
          browser_pid=$!
          trap 'kill "$backup_pid" "$browser_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4203/healthz > /dev/null
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4202/ > /dev/null
          AUTONAVLOG_LOCAL_URL=http://localhost:4202 npm --prefix web run test:forecast-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-${{ matrix.suite }}-${{ matrix.shard }}-failure
          path: |
            /tmp/autonavlog-issue117-playwright
            /tmp/autonavlog-static-browser
            /tmp/autonavlog-navlog-scroll-browser
            /tmp/autonavlog-issue122-browser
            /tmp/autonavlog-taf-playwright
            /tmp/local-server.log
            /tmp/autonavlog-forecast-backup-browser
            /tmp/backup-server.log
            /tmp/backup-browser-server.log
            /tmp/autonavlog-auth-tests
            /tmp/autonavlog-sync-component-browser
            /tmp/navmate-416-443-test-results
            /tmp/navmate-543-browser
            /tmp/autonavlog-focused-ux-browser
            /tmp/autonavlog-clipboard-playwright

  local-browser:
    needs: [release-sources, local-browser-tests]
    if: ${{ always() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_local_browser != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Local browser suite
        env:
          RESULT: ${{ needs.local-browser-tests.result }}
        run: test "$RESULT" = success

  account-sync-tests:
    needs: release-sources
    # Missing/failed classification runs this suite; only an explicit false skips.
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_account_sync != 'false') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PIP_CACHE_DIR: /tmp/navmate-pip-cache
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [chromium, ipad-webkit, iphone-webkit]
        shard: [1, 2]
        include:
          - {suite: contracts, shard: 1}
          - {suite: dev-shared, shard: 1}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      # setup-python's Linux pip cache requires lsb_release, absent from the browser image.
      - uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-playwright-1.62.1-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'vendor/*.whl', '.github/workflows/test.yml') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install "setuptools>=69" wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl ".[test]"
      - run: npm --prefix web ci
      - run: npm --prefix web run prepare:local
        env:
          AUTONAVLOG_TEST_FIXTURES: "1"
      - name: Verify real SDK, Rules and cross-device Local-first workflows
        if: matrix.suite != 'dev-shared'
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}/2
        run: |
          # Only migration tests use the legacy HTTP fixture; sync uses Local + Firestore.
          if [ "$SUITE" = contracts ]; then
            PYTHONPATH=src:tests/integration python -m uvicorn migration_harness:app --host 127.0.0.1 --port 8186 > /tmp/migration-harness.log 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid"' EXIT
            curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8186/healthz > /dev/null
          fi
          npx --yes firebase-tools@15.10.1 emulators:exec --only firestore --project demo-autonavlog-sync "sh scripts/run_account_sync_suite.sh $SUITE $SHARD"
      - name: Verify Firestore migration evidence lifecycle
        if: matrix.suite == 'contracts' && matrix.shard == 1
        run: >-
          npx --yes firebase-tools@15.10.1 emulators:exec
          --config firebase.migration-evidence.json --only firestore --project demo-migration-evidence
          "MIGRATION_TEST_EMULATOR=127.0.0.1:8092 PYTHONPATH=src:. python -m pytest -q tests/unit/test_migration_firestore.py"
      - name: Verify shared development with isolated Firebase emulators
        if: matrix.suite == 'dev-shared'
        run: npx --yes firebase-tools@15.10.1 emulators:exec --config firebase.dev.json --only auth,firestore --project navmate-6b281 "npm --prefix web run test:dev-shared"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-sync-${{ matrix.suite }}-${{ matrix.shard }}-failure
          path: |
            /tmp/autonavlog-sync-browser
            /tmp/autonavlog-migration-browser
            /tmp/migration-harness.log
            /tmp/autonavlog-firestore-tests
            /tmp/autonavlog-storage-upgrade
            /tmp/navmate-dev-shared-results
            firestore-debug.log

  account-sync:
    needs: [release-sources, account-sync-tests]
    if: ${{ always() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_account_sync != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every Account Sync suite
        env:
          RESULT: ${{ needs.account-sync-tests.result }}
        run: test "$RESULT" = success

  msm-trigger:
    needs: release-sources
    if: ${{ !cancelled() && (needs.release-sources.result != 'success' || needs.release-sources.outputs.run_msm_trigger != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/msm-trigger/package-lock.json
      - run: npm --prefix services/msm-trigger ci
      - run: npm --prefix services/msm-trigger run typecheck
      - run: npm --prefix services/msm-trigger run check
      - run: npm --prefix services/msm-trigger test

  ci-required:
    needs: [release-sources, release-build, pytest, runtime, web, taf-proxy, local-browser, account-sync, static-tooling-install, msm-trigger]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require selected suites and report intentional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
