name: release-preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - VERSION
      - firebase/firestore.rules
      - firebase/firestore.indexes.json
      - data/schemas/project.schema.json
      - web/src/localProjectRepository.ts
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate commit to inspect (read only)
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
    outputs:
      route:
        value: ${{ jobs.preflight.outputs.route }}

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      # PR results are advisory and have no environment or provider credentials.
      # The release publisher runs the merged tooling and repeats this gate.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install preflight dependencies
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl .
      - name: Inspect approved production and candidate contracts
        id: route
        env:
          STATIC_APPROVED_SHA: ${{ vars.STATIC_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
        run: python3 scripts/static_ops/release_preflight.py --sha "$CANDIDATE_SHA"
