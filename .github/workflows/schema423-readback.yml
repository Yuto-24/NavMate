name: schema423-readback

# Explicit read-only inspection of the v2.3.1 schema-transition production identity.
# This never prepares, publishes, pauses schedules or updates repository variables.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: schema423-readback
  cancel-in-progress: false

jobs:
  readback:
    if: github.repository == 'Yuto-24/NavMate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing readback dependencies
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Obtain read-only Firebase Rules identity
        id: rules-read
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Compare canonical, Pages inventory and live Rules (GET only)
        env:
          STATIC_APPROVED_SHA: ${{ vars.STATIC_APPROVED_SHA }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Existing read-only probe credential; never use the Pages upload token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-read.outputs.access_token }}
        run: python scripts/static_ops/schema423_readback.py
