name: publish-github-release

on:
  push:
    branches: [main, release/1.x, release/2.x]
    paths: [VERSION]

permissions:
  contents: write

# Serialize publication across all release branches without cancelling a release.
concurrency:
  group: publish-github-release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      candidate_sha: ${{ github.sha }}

  release:
    needs: preflight
    if: needs.preflight.outputs.route == 'AUTOMATIC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the matching version line
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github_release.py

  migration:
    needs: preflight
    if: needs.preflight.outputs.route == 'MANUAL'
    runs-on: ubuntu-latest
    steps:
      - name: Continue with migration evidence before creating a Release
        run: echo 'No GitHub Release was created (MANUAL migration required). Review migration evidence in Firestore Console, then authorize prepare and publication from App Release with the record ID and SHA-256 for each step.' >> "$GITHUB_STEP_SUMMARY"
