name: static-app-release
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'readback') && 'schema423-readback' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-schema431') && 'schema431-prepare' || format('app-release/{0}', github.event.release.tag_name || github.event.workflow_run.id || inputs.release_id) }}

on:
  release:
    types: [published]
  # GITHUB_TOKEN-created Releases do not emit downstream release workflows.
  # This completion bridge also works for release/1.x without deploying its tooling.
  workflow_run:
    workflows: [publish-github-release]
    types: [completed]
    branches: [main, release/1.x, release/2.x]
  workflow_dispatch:
    inputs:
      operation:
        description: 'readback / replay-release / prepare-schema431'
        required: true
        type: choice
        default: readback
        options:
          - readback
          - replay-release
          - prepare-schema431
      release_id:
        description: 'Existing stable GitHub Release ID (only for replay-release)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: static-production
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      vars.STATIC_APP_RELEASE_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.operation == 'replay-release' && inputs.release_id != '')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same unattended environment as forecast updates. Changed contracts STOP in
    # compatibility(); approval and Rules migration use the separate manual path.
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install trusted producer tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Obtain read-only Rules identity for preparation
        id: rules-prepare
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Prepare only a newer compatible stable Release
        timeout-minutes: 50
        env:
          # Separate existing credential: GITHUB_TOKEN cannot write Actions variables.
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-prepare.outputs.access_token }}
        run: python3 scripts/static_ops/release_automation.py prepare
      # Renew after the isolated build rather than persisting an expiring token.
      - name: Obtain read-only Rules identity for publication
        id: rules-publish
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish the policy-authorized plan with a fresh isolated build
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-publish.outputs.access_token }}
        run: python3 scripts/static_ops/release_automation.py publish
      - name: Record bounded publication status without private evidence
        if: always()
        run: python3 scripts/static_ops/release_automation.py report >> "$GITHUB_STEP_SUMMARY"

  # WIF provider accepts ONLY this workflow_ref + environment:static-production.
  # An explicit dispatch-only job avoids running the publisher or loosening IAM.
  readback:
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'readback'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing readback dependencies
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Obtain read-only Firebase Rules identity
        id: rules-read
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Compare canonical, Pages inventory and live Rules (GET only)
        env:
          STATIC_APPROVED_SHA: ${{ vars.STATIC_APPROVED_SHA }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-read.outputs.access_token }}
        run: python scripts/static_ops/schema423_readback.py

  # Same WIF workflow_ref/environment, with a separate, prepare-only entry point.
  # The operation identifier is deliberately specific to the reviewed #431 inputs.
  manual-prepare:
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'prepare-schema431' &&
      inputs.release_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 64225b82c9b2e978409f0b35490be3c83af3f157
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the fixed reviewed tooling dependencies
        working-directory: tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Reserve the original private evidence parent on the ephemeral runner
        run: |
          test ! -e /home/yuto
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/yuto/autonavlog-releases
      - name: Obtain the existing read-only Rules identity
        id: rules-manual
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Validate, pause and prepare the fixed schema transition
        id: prepare
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-manual.outputs.access_token }}
          SCHEMA431_EVIDENCE: ${{ secrets.STATIC_SCHEMA431_EVIDENCE }}
          SCHEMA431_ARCHIVE_KEY: ${{ secrets.STATIC_SCHEMA431_ARCHIVE_KEY }}
        run: python driver/scripts/static_ops/schema431_prepare.py run --tooling "$GITHUB_WORKSPACE/tooling"
      - name: Retain only the authenticated encrypted result
        id: archive
        if: always() && steps.prepare.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema431-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema431-result-${{ github.run_id }}-${{ github.run_attempt }}.aesgcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record bounded preparation and archive status
        if: always()
        env:
          ARCHIVE_UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: python driver/scripts/static_ops/schema431_prepare.py report >> "$GITHUB_STEP_SUMMARY"
