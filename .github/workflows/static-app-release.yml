name: static-app-release
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'readback-v260') && 'schema260-readback' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-schema260') && 'schema260-prepare' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-schema260') && 'schema260-publish' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'readback') && 'schema423-readback' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-schema431') && 'schema431-prepare' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-schema431') && 'schema431-publish' || format('app-release/{0}', github.event.release.tag_name || github.event.workflow_run.id || inputs.release_id) }}

on:
  schedule:
    - cron: '23 18 * * *'
  release:
    types: [published]
  # GITHUB_TOKEN-created Releases do not emit downstream release workflows.
  # This completion bridge also works for release/1.x without deploying its tooling.
  # Only Release publisher completion is relevant; ordinary test pushes must not trigger.
  workflow_run:
    workflows: [publish-github-release]
    types: [completed]
    branches: [main, release/1.x, release/2.x]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Select a readback, replay, or migration operation; revoke-migration is permanent and requires new evidence to start over'
        required: true
        type: choice
        default: readback
        options:
          - readback
          - replay-release
          - prepare-schema431
          - publish-schema431
          - readback-v260
          - prepare-schema260
          - publish-schema260
          - evidence-migration
          - prepare-migration
          - publish-migration
          - revoke-migration
          - acceptance-migration
      release_id:
        description: 'Existing stable GitHub Release ID (only for replay-release)'
        required: false
        type: string
      prepare_run_id:
        description: 'Reviewed prepare Run ID (schema publish only)'
        required: false
        type: string
      prepare_run_attempt:
        description: 'Reviewed prepare attempt (schema publish only)'
        required: false
        type: string
      reviewed_plan_sha256:
        description: 'Explicitly approved 64-character plan SHA-256 (schema publish only)'
        required: false
        type: string
      candidate_sha:
        description: 'Candidate commit SHA for evidence-migration; empty uses the selected main commit'
        required: false
        type: string
      migration_record_id:
        description: 'Firestore record ID: evidence for prepare, prepared plan for publish, target record for revoke'
        required: false
        type: string
      reviewed_record_sha256:
        description: 'SHA-256 of the Firestore record you reviewed (prepare, publish, or revoke)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  routing:
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      vars.STATIC_APP_RELEASE_ENABLED == 'true' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl .
      - id: route
        env:
          STATIC_APPROVED_SHA: ${{ vars.STATIC_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/static_ops/release_preflight.py --sha "$CANDIDATE_SHA"

  # Release events only. Wait for the exact tag's push CI before taking the
  # static-production lease, so routine CI completions cannot launch this workflow.
  source-ci:
    needs: routing
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || needs.routing.outputs.route == 'AUTOMATIC') &&
      github.repository == 'Yuto-24/NavMate' &&
      vars.STATIC_APP_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Wait for the Release tag's successful full push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/static_ops/release_ci_gate.py

  publish:
    needs: [source-ci]
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      always() &&
      github.repository == 'Yuto-24/NavMate' &&
      vars.STATIC_APP_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.source-ci.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.operation == 'replay-release' && inputs.release_id != '')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same unattended environment as forecast updates. Changed contracts STOP in
    # compatibility(); approval and Rules migration use the separate manual path.
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install trusted producer tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Obtain read-only Rules identity for preparation
        id: rules-prepare
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Prepare only a newer compatible stable Release
        timeout-minutes: 50
        env:
          # Separate existing credential: GITHUB_TOKEN cannot write Actions variables.
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-prepare.outputs.access_token }}
        run: python3 scripts/static_ops/release_automation.py prepare
      # Renew after the isolated build rather than persisting an expiring token.
      - name: Obtain read-only Rules identity for publication
        id: rules-publish
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish the policy-authorized plan with a fresh isolated build
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-publish.outputs.access_token }}
        run: python3 scripts/static_ops/release_automation.py publish
      - name: Retain bounded common release observations
        id: review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-release-${{ github.run_id }}-${{ github.run_attempt }}/*-review.json
          if-no-files-found: warn
          retention-days: 1
      - name: Record bounded publication status without private evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_UPLOAD_OUTCOME: ${{ steps.review.outcome }}
        run: python3 scripts/static_ops/release_automation.py report >> "$GITHUB_STEP_SUMMARY"

  # WIF provider accepts ONLY this workflow_ref + environment:static-production.
  # An explicit dispatch-only job avoids running the publisher or loosening IAM.
  readback:
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'readback'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install existing readback dependencies
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Obtain read-only Firebase Rules identity
        id: rules-read
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Compare canonical, Pages inventory and live Rules (GET only)
        env:
          STATIC_APPROVED_SHA: ${{ vars.STATIC_APPROVED_SHA }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-read.outputs.access_token }}
        run: python scripts/static_ops/schema423_readback.py

  # Same WIF workflow_ref/environment, with a separate, prepare-only entry point.
  # The operation identifier is deliberately specific to the reviewed #431 inputs.
  manual-prepare:
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'prepare-schema431' &&
      inputs.release_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 64225b82c9b2e978409f0b35490be3c83af3f157
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the fixed reviewed tooling dependencies
        working-directory: tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Reserve the original private evidence parent on the ephemeral runner
        run: |
          test ! -e /home/yuto
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/yuto/autonavlog-releases
      - name: Obtain the existing read-only Rules identity
        id: rules-manual
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Validate, pause and prepare the fixed schema transition
        id: prepare
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-manual.outputs.access_token }}
          SCHEMA431_EVIDENCE: ${{ secrets.STATIC_SCHEMA431_EVIDENCE }}
          SCHEMA431_ARCHIVE_KEY: ${{ secrets.STATIC_SCHEMA431_ARCHIVE_KEY }}
        run: python driver/scripts/static_ops/schema431_prepare.py run --tooling "$GITHUB_WORKSPACE/tooling"
      - name: Retain the small preparation observation first
        id: review
        if: always() && steps.prepare.outputs.review_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema431-result-${{ github.run_id }}-${{ github.run_attempt }}.review.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain only the authenticated encrypted result
        id: archive
        if: always() && steps.prepare.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema431-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema431-result-${{ github.run_id }}-${{ github.run_attempt }}.aesgcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record bounded preparation and archive status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_UPLOAD_OUTCOME: ${{ steps.review.outcome }}
          ARCHIVE_UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: python driver/scripts/static_ops/schema431_prepare.py report >> "$GITHUB_STEP_SUMMARY"

  # Separate explicit approval; no release event, policy approval, or automatic retry.
  manual-publish:
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'publish-schema431' &&
      inputs.release_id == '' &&
      inputs.prepare_run_id != '' && inputs.prepare_run_attempt != '' &&
      inputs.reviewed_plan_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 64225b82c9b2e978409f0b35490be3c83af3f157
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the fixed reviewed tooling dependencies
        working-directory: tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]'
      - name: Reserve the original private evidence parent on the ephemeral runner
        run: |
          test ! -e /home/yuto
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/yuto/autonavlog-releases
      - name: Obtain a fresh read-only Rules identity for approved publication
        id: rules-manual-publish
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Restore the approved plan and publish with the fixed reviewed gates
        id: publish-plan
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_ACCESS_TOKEN: ${{ steps.rules-manual-publish.outputs.access_token }}
          SCHEMA431_ARCHIVE_KEY: ${{ secrets.STATIC_SCHEMA431_ARCHIVE_KEY }}
        run: python driver/scripts/static_ops/schema431_publish.py run --tooling "$GITHUB_WORKSPACE/tooling"
      - name: Retain the small publication observation first
        id: review
        if: always() && steps.publish-plan.outputs.review_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema431-result-${{ github.run_id }}-${{ github.run_attempt }}.review.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain only the authenticated encrypted publication record
        id: archive
        if: always() && steps.publish-plan.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema431-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema431-result-${{ github.run_id }}-${{ github.run_attempt }}.aesgcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record bounded publication and archive status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_UPLOAD_OUTCOME: ${{ steps.review.outcome }}
          ARCHIVE_UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: python driver/scripts/static_ops/schema431_publish.py report >> "$GITHUB_STEP_SUMMARY"

  # Same WIF workflow_ref/environment, with a separate, prepare-only entry point.
  # The operation identifier is deliberately specific to the reviewed #260 inputs.
  manual-prepare-v260:
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'prepare-schema260' &&
      inputs.release_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: d6f116920709ae1a624d81ee6954b586d93d99ab
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the fixed reviewed tooling dependencies
        working-directory: tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]' 'google-auth[requests]==2.63.1'
      - name: Reserve the original private evidence parent on the ephemeral runner
        run: |
          test ! -e /home/yuto
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/yuto/autonavlog-releases
      - name: Obtain the existing read-only Rules identity
        id: rules-manual
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: true
          export_environment_variables: false
      - name: Validate, pause and prepare the fixed schema transition
        id: prepare
        timeout-minutes: 135
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STATIC_CLOUDFLARE_READ_TOKEN }}
          STATIC_GOOGLE_CREDENTIALS_FILE: ${{ steps.rules-manual.outputs.credentials_file_path }}
          SCHEMA260_EVIDENCE: ${{ secrets.STATIC_SCHEMA260_EVIDENCE }}
          SCHEMA260_ARCHIVE_KEY: ${{ secrets.STATIC_SCHEMA260_ARCHIVE_KEY }}
        run: python driver/scripts/static_ops/schema260_prepare.py run --tooling "$GITHUB_WORKSPACE/tooling"
      - name: Retain the small preparation observation first
        id: review
        if: always() && steps.prepare.outputs.review_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema260-result-${{ github.run_id }}-${{ github.run_attempt }}.review.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain only the authenticated encrypted result
        id: archive
        if: always() && steps.prepare.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema260-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema260-result-${{ github.run_id }}-${{ github.run_attempt }}.aesgcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record bounded preparation and archive status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_UPLOAD_OUTCOME: ${{ steps.review.outcome }}
          ARCHIVE_UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: python driver/scripts/static_ops/schema260_prepare.py report >> "$GITHUB_STEP_SUMMARY"

  # Separate explicit approval; no release event, policy approval, or automatic retry.
  manual-publish-v260:
    concurrency:
      group: static-production
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'Yuto-24/NavMate' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'publish-schema260' &&
      inputs.release_id == '' &&
      inputs.prepare_run_id != '' && inputs.prepare_run_attempt != '' &&
      inputs.reviewed_plan_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: static-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: d6f116920709ae1a624d81ee6954b586d93d99ab
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the fixed reviewed tooling dependencies
        working-directory: tooling
        run: python -m pip install 'setuptools>=69' wheel vendor/jma_gpv_weather-0.6.0-py3-none-any.whl '.[test]' 'google-auth[requests]==2.63.1'
      - name: Reserve the original private evidence parent on the ephemeral runner
        run: |
          test ! -e /home/yuto
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /home/yuto/autonavlog-releases
      - name: Obtain a fresh read-only Rules identity for approved publication
        id: rules-manual-publish-v260
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STATIC_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STATIC_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: true
          export_environment_variables: false
      - name: Restore the approved plan and publish with the fixed reviewed gates
        id: publish-plan
        timeout-minutes: 135
        env:
          GH_TOKEN: ${{ secrets.STATIC_APP_RELEASE_GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STATIC_GOOGLE_CREDENTIALS_FILE: ${{ steps.rules-manual-publish-v260.outputs.credentials_file_path }}
          SCHEMA260_ARCHIVE_KEY: ${{ secrets.STATIC_SCHEMA260_ARCHIVE_KEY }}
        run: python driver/scripts/static_ops/schema260_publish.py run --tooling "$GITHUB_WORKSPACE/tooling"
      - name: Retain the small publication observation first
        id: review
        if: always() && steps.publish-plan.outputs.review_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema260-result-${{ github.run_id }}-${{ github.run_attempt }}.review.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain only the authenticated encrypted publication record
        id: archive
        if: always() && steps.publish-plan.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema260-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema260-result-${{ github.run_id }}-${{ github.run_attempt }}.aesgcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record bounded publication and archive status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STEP_OUTCOME: ${{ steps.publish-plan.outcome }}
          REVIEW_UPLOAD_OUTCOME: ${{ steps.review.outcome }}
          ARCHIVE_UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: python driver/scripts/static_ops/schema260_publish.py report >> "$GITHUB_STEP_SUMMARY"

