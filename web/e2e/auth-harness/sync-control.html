<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /></head>
<body>
<script type="module">
  import { mount } from "./sync-control.tsx";
  import "../../src/styles.css";

  // A standalone entry remounts after Vite reloads, without a second App dialog.
  const params = new URLSearchParams(location.search);
  const operation = params.get("operation");
  if (operation !== "resolve" && operation !== "import") throw new Error("Unknown test operation");
  mount(operation, params.get("guard") === "1");
</script>
</body>
</html>
